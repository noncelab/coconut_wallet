plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0.0'
}

def getFlavor() {
    def taskNames = gradle.startParameter.taskNames
    if (taskNames.any { it.toLowerCase().contains("regtest")}) {
        return "regtest"
    } else if (taskNames.any { it.toLowerCase().contains("mainnet")}) {
        return "mainnet"
    }
    throw new RuntimeException("❌ build flavor를 추론할 수 없습니다. taskNames: ${taskNames}")
}
def flavor = getFlavor()
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key_${flavor}.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
} else {
    throw new RuntimeException("❌ keystore properties 파일이 존재하지 않습니다: ${keystorePropertiesFile}")
}

def signingStorePassword = System.getenv("ANDROID_SIGNING_STORE_PASSWORD")
def signingKeyPassword = System.getenv("ANDROID_SIGNING_KEY_PASSWORD")
def isReleaseBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("release") }
def isBundleBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains("bundle") }
def useDebugSigningForReleaseRun = System.getenv("ANDROID_USE_DEBUG_SIGNING_FOR_RELEASE_RUN") == "true" && !isBundleBuild
if (isReleaseBuild && !useDebugSigningForReleaseRun && (!signingStorePassword || !signingKeyPassword)) {
    throw new RuntimeException("❌ Android 서명 비밀번호 환경변수가 설정되지 않았습니다.")
}

def googleServicesFile = file("google-services.json")
def requireGoogleServices = System.getenv("REQUIRE_GOOGLE_SERVICES")?.toBoolean() ?: false
if (flavor == "mainnet" && requireGoogleServices) {
    if (!googleServicesFile.exists()) {
        throw new RuntimeException(
            "[Firebase] mainnet 배포에 필요한 google-services.json이 없습니다: ${googleServicesFile.absolutePath}"
        )
    }

    apply plugin: 'com.google.gms.google-services'
}

android {
    namespace "onl.coconut.wallet"
    compileSdk 36
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "onl.coconut.wallet"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword signingKeyPassword
            storeFile file(keystoreProperties['storeFile'])
            storePassword signingStorePassword
        }
    }

    buildTypes {
        release {
            signingConfig useDebugSigningForReleaseRun ? signingConfigs.debug : signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "network"
    productFlavors {
         regtest {
            dimension "network"
            applicationIdSuffix ".regtest"
            versionNameSuffix "-regtest"
        }
        mainnet {
            dimension "network"
            applicationIdSuffix ""
            versionNameSuffix ""
        }
    }

    packagingOptions {
      jniLibs {
        useLegacyPackaging true
      }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "androidx.core:core-splashscreen:1.0.0"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation(name: 'bitboxbridge', ext: 'aar')
    implementation "net.java.dev.jna:jna:5.17.0@aar"
}

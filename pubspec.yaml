  dio: ^5.5.0+1
  http: ^1.2.1
  in_app_review: ^2.0.11
  equatable: ^2.0.5
  flutter_dotenv: ^5.1.0
  device_info_plus: ^10.1.1
  package_info_plus: ^8.0.1
  realm: 20.2.0
  cryptography: ^2.7.0
  slang: ^4.7.0
  slang_flutter: ^4.7.0
  async: ^2.11.0
  decimal: ^3.0.2
  tuple: ^2.0.2
  cbor: ^6.3.5
  ur:
    path: lib/packages/bc-ur-dart
  shimmer: ^3.0.0
  visibility_detector: ^0.4.0+2
  coconut_lib: 1.1.0
  base32: ^2.1.3
  share_plus: ^11.1.0
  mobile_scanner: 7.0.1
  firebase_core: ^3.15.2
  firebase_analytics: ^11.6.0
  vpn_detector: ^1.2.0
  coconut_design_system: 0.10.3

